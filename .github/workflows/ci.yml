name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tradesim-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Run tests
        run: mvn clean verify
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Build JAR
        run: mvn package -DskipTests

      - name: Build Docker image
        run: docker build -t tradesim-backend:ci .

      - name: Run Docker container
        run: |
          docker run -d --name tradesim-backend-ci -p 8080:8080 tradesim-backend:ci
          sleep 10

      - name: Verify container is running
        run: |
          docker ps | grep tradesim-backend-ci

      - name: Stop Docker container
        if: always()
        run: |
          docker stop tradesim-backend-ci
          docker rm tradesim-backend-ci