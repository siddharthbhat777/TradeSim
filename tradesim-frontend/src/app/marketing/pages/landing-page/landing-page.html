<div class="landing-wrapper">
    <nav class="marketing-nav">
        <div class="nav-container">
            <div class="nav-brand">
                <app-logo [size]="isMobile() ? 'small' : 'medium'" [showText]="!isMobile()"></app-logo>
            </div>

            <div class="nav-links">
                <a href="#features">Features</a>
                <a href="#markets">Markets</a>
                <a href="#ipo">Corporate</a>
            </div>

            <div class="nav-actions">
                @if (!isLoggedIn()) {
                <button class="btn-ghost" (click)="showAuthDialog(authStatus.Login)">Log In</button>
                <button class="btn-primary" (click)="showAuthDialog(authStatus.Register)">Start Trading</button>
                } @else {
                <button class="btn-ghost" (click)="logoutUser()">Log Out</button>
                <button class="btn-primary" routerLink="/app">Dashboard</button>
                }
            </div>
        </div>
    </nav>

    <app-hero [isLoggedIn]="isLoggedIn()" (openAuth)="showAuthDialog(authStatus.Register)">
    </app-hero>

    <app-mechanics></app-mechanics>
    <app-features></app-features>
    <app-cta></app-cta>

    @if(showAuth()) {
    <app-auth (showAuth)="closeAuth()" />
    }
</div>
