@if(!isLoggedIn()) {
<section>
    <button (click)="showAuthDialog(authStatus.Login)">Login</button>

</section>
} @else {
<section>Username</section>
}
<br>

@if(showAuth()) {
<app-auth (showAuth)="closeAuth()" />
}
<button [routerLink]="isLoggedIn() ? 'app' : ''">Go to app</button>
