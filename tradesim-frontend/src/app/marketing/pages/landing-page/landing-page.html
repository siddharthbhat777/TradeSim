<p>landing-page works!</p>
@if(!isLoggedIn()) {
<section>
    <button (click)="showAuthDialog(authStatus.Login)">Login</button>
    <button (click)="showAuthDialog(authStatus.Register)">Signup</button>
</section>
} @else {
<section>
    <h1>Hello {{ userDetails()?.username }}</h1>
    <button (click)="logoutUser()">Logout</button>
</section>
}
<br>

@if(showAuth()) {
<app-auth (showAuth)="closeAuth()" />
}
<button routerLink="app">Go to app</button>
