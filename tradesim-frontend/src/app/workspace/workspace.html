<div class="workspace">
    <header class="workspace__mobile-header">
        <button class="workspace__mobile-toggle" (click)="toggleMobileMenu()" aria-label="Toggle Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">
                <line x1="4" y1="6" x2="20" y2="6"></line>
                <line x1="4" y1="12" x2="20" y2="12"></line>
                <line x1="4" y1="18" x2="20" y2="18"></line>
            </svg>
        </button>

        <div class="workspace__mobile-brand">
            <app-logo size="small" [showText]="true"></app-logo>
        </div>
    </header>

    <ng-template #sidebarContent>
        <div class="workspace__brand">
            <div class="workspace__brand-logo">
                <app-logo size="small" [showText]="true"></app-logo>
            </div>
        </div>

        <nav class="workspace__nav">
            @for (item of menuItems(); track item.route) {
            <a [routerLink]="item.route" routerLinkActive="workspace__nav-link--active" class="workspace__nav-link"
                (click)="closeMobileMenu()">

                <div class="workspace__tooltip-layer">
                    <app-tooltip [text]="isCollapsed() ? item.label : ''" position="right">
                        <div class="workspace__tooltip-trigger"></div>
                    </app-tooltip>
                </div>

                <div class="workspace__nav-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        @switch (item.icon) {
                        @case ('pie-chart') {
                        <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
                        <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
                        }
                        @case ('line-chart') {
                        <path d="M3 3v18h18"></path>
                        <path d="m19 9-5 5-4-4-3 3"></path>
                        }
                        @case ('shopping-cart') {
                        <path d="m16 3 4 4-4 4"></path>
                        <path d="M20 7H4"></path>
                        <path d="m8 21-4-4 4-4"></path>
                        <path d="M4 17h16"></path>
                        }
                        @case ('landmark') {
                        <polygon points="12 2 2 7 22 7 12 2"></polygon>
                        <polyline points="2 17 22 17"></polyline>
                        <polyline points="2 22 22 22"></polyline>
                        <line x1="6" y1="17" x2="6" y2="7"></line>
                        <line x1="10" y1="17" x2="10" y2="7"></line>
                        <line x1="14" y1="17" x2="14" y2="7"></line>
                        <line x1="18" y1="17" x2="18" y2="7"></line>
                        }
                        @case ('wallet') {
                        <path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5">
                        </path>
                        <path d="M16 10h5v4h-5z"></path>
                        }
                        @case ('user') {
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                        }
                        @default {
                        <circle cx="12" cy="12" r="10"></circle>
                        }
                        }
                    </svg>
                </div>

                <span class="workspace__nav-label">{{ item.label }}</span>
            </a>
            }
        </nav>

        <div class="workspace__sidebar-footer">
            <button class="workspace__nav-link" (click)="onSettingsClick()">
                <div class="workspace__tooltip-layer">
                    <app-tooltip [text]="isCollapsed() ? 'Settings' : ''" position="right">
                        <div class="workspace__tooltip-trigger"></div>
                    </app-tooltip>
                </div>
                <div class="workspace__nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path
                            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z">
                        </path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </div>
                <span class="workspace__nav-label">Settings</span>
            </button>

            <button class="workspace__nav-link workspace__nav-link--danger" (click)="onLogoutClick()">
                <div class="workspace__tooltip-layer">
                    <app-tooltip [text]="isCollapsed() ? 'Logout' : ''" position="right">
                        <div class="workspace__tooltip-trigger"></div>
                    </app-tooltip>
                </div>
                <div class="workspace__nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </div>
                <span class="workspace__nav-label">Logout</span>
            </button>
        </div>
    </ng-template>

    <aside class="workspace__sidebar" [class.workspace__sidebar--collapsed]="isCollapsed()">
        <button class="workspace__collapse-icon" (click)="toggleCollapse()" aria-label="Toggle Sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" [style.transform]="isCollapsed() ? 'rotate(180deg)' : 'none'">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>

        <ng-container *ngTemplateOutlet="sidebarContent"></ng-container>
    </aside>

    <app-drawer [(isOpen)]="isMobileMenuOpen" position="left" [hideCloseButton]="true" [closeOnBackdrop]="true">
        <div class="workspace__mobile-sidebar-content">
            <ng-container *ngTemplateOutlet="sidebarContent"></ng-container>
        </div>
    </app-drawer>

    <main class="workspace__main">
        <div class="workspace__content">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>
