<div class="approvals-container">
    <div class="approvals-header">
        <h1 class="heading-xl m-0">Approval Center</h1>
    </div>

    <div class="approvals-controls">
        <app-segmented-control [options]="tabOptions()" [formControl]="tabControl" size="large" required fullWidth>
        </app-segmented-control>
    </div>

    @if (tabControl.value === 'Listing') {
    <app-listing-approvals [highlightedId]="highlightedId()" [data]="listings()" [users]="users()"
        [isLoading]="isLoading()" (processed)="onListingProcessed($event)">
    </app-listing-approvals>
    } @else if (tabControl.value === 'IPO') {
    <app-ipo-approvals [highlightedId]="highlightedId()" [data]="ipos()" [isLoading]="isLoading()"
        (processed)="onIpoProcessed($event)">
    </app-ipo-approvals>
    } @else if (tabControl.value === 'Wallet') {
    <app-wallet-approvals [highlightedId]="highlightedId()" [data]="wallets()" [users]="users()"
        [isLoading]="isLoading()" (processed)="onWalletProcessed($event)">
    </app-wallet-approvals>
    }
</div>
