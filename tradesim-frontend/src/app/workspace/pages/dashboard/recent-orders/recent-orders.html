<app-card variant="surface">
    <div class="recent-orders__header">
        <h3 class="text-label recent-orders__title">Recent Orders</h3>
        <app-button variant="secondary" size="small" routerLink="/app/order">See All</app-button>
    </div>

    <div class="recent-orders__content">
        <app-table variant="flush" [data]="orders()" [columns]="columns" [paginated]="true"
            [pageSizeOptions]="[5, 10, 20]" [(pageSize)]="pageSize" size="small" emptyText="No recent orders"
            emptySubtext="Your executed and open orders will appear here." paginationLabelSuffix=" per page"
            paginationMobileLabelSuffix=" / pg">

            <ng-template tableCell="createdAt" let-value>
                <span class="recent-orders__date">{{ value | date:'dd MMM yyyy, hh:mm a' }}</span>
            </ng-template>

            <ng-template tableCell="symbol" let-value>
                <span class="recent-orders__symbol">{{ value }}</span>
            </ng-template>

            <ng-template tableCell="side" let-value>
                <span class="recent-orders__badge" [class.recent-orders__badge--buy]="value === 'BUY'"
                    [class.recent-orders__badge--sell]="value === 'SELL'">
                    {{ value }}
                </span>
            </ng-template>

            <ng-template tableCell="orderType" let-value>
                <span class="recent-orders__type">{{ value }}</span>
            </ng-template>

            <ng-template tableCell="quantity" let-row="row">
                <span class="recent-orders__qty">{{ row.filledQuantity | number }} / {{ row.quantity | number }}</span>
            </ng-template>

            <ng-template tableCell="limitPrice" let-value let-row="row">
                @if (row.orderType === 'MARKET') {
                <span class="recent-orders__market-price">Market</span>
                } @else {
                <span>{{ value | currency:currency():'symbol':'1.2-2' }}</span>
                }
            </ng-template>

            <ng-template tableCell="status" let-value>
                <span class="recent-orders__status" [class.recent-orders__status--open]="value === 'OPEN'"
                    [class.recent-orders__status--partially-filled]="value === 'PARTIALLY_FILLED'"
                    [class.recent-orders__status--filled]="value === 'FILLED'"
                    [class.recent-orders__status--cancelled]="value === 'CANCELLED'">
                    {{ formatStatus(value) }}
                </span>
            </ng-template>

        </app-table>
    </div>
</app-card>
