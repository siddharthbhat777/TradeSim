<app-card variant="surface">
    <h3 class="text-label holdings__title">Open Positions</h3>

    <div class="holdings__content">
        <app-table variant="flush" [data]="holdings()" [columns]="columns" [paginated]="true"
            [pageSizeOptions]="[5, 10]" [(pageSize)]="pageSize" size="small" emptyText="No open positions"
            emptySubtext="Your purchased stocks will appear here.">

            <ng-template tableCell="symbol" let-value>
                <span class="holdings__symbol">{{ value }}</span>
            </ng-template>

            <ng-template tableCell="quantity" let-value>
                {{ value | number }}
            </ng-template>

            <ng-template tableCell="averageBuyPrice" let-value>
                {{ value | currency:currency():'symbol':'1.2-2' }}
            </ng-template>

            <ng-template tableCell="currentPrice" let-value>
                {{ value | currency:currency():'symbol':'1.2-2' }}
            </ng-template>

            <ng-template tableCell="currentValue" let-value>
                {{ value | currency:currency():'symbol':'1.2-2' }}
            </ng-template>

            <ng-template tableCell="unrealizedPnl" let-value>
                <app-price-indicator [value]="value" [currency]="currency()" [showPercentage]="false">
                </app-price-indicator>
            </ng-template>

        </app-table>
    </div>
</app-card>
