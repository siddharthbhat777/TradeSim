<div class="portfolio-page">
    <div class="portfolio-header">
        <h1>Portfolio</h1>
    </div>

    <app-summary [portfolio]="portfolio()" [risk]="riskData()" [baseCurrency]="baseCurrency()"></app-summary>

    <div class="portfolio-middle">
        <div class="portfolio-middle__history">
            <app-history-chart [data]="historyData()" [baseCurrency]="baseCurrency()"></app-history-chart>
        </div>
        <div class="portfolio-middle__allocation">
            <app-allocation [data]="exposureData()"></app-allocation>
        </div>
    </div>

    <app-holdings-table [holdings]="portfolio()?.holdings || []" [baseCurrency]="baseCurrency()"></app-holdings-table>
</div>
