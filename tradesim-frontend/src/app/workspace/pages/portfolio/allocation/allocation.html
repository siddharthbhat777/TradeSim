<app-card variant="surface">
    <h3 class="text-label allocation__title">Portfolio Allocation</h3>

    <div class="allocation__content">
        @if (data().length > 0) {
        <app-pie-chart-container [data]="data()" shape="full" chartStyle="donut" legendPosition="bottom" [wrap]="true"
            [size]="240">
        </app-pie-chart-container>
        } @else {
        <app-empty-state text="No assets found"
            subtext="Your asset allocation will appear here once you fund your wallet or purchase stocks.">
            <svg icon xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
                <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
            </svg>
        </app-empty-state>
        }
    </div>
</app-card>
