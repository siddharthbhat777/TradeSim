@if (isVisible()) {
<div class="drawer-backdrop" [class.is-open]="isAnimating()" (click)="onBackdropClick($event)">
    <div class="drawer-panel" [class]="'drawer-panel--' + position()" [class.is-open]="isAnimating()"
        (click)="$event.stopPropagation()">
        @if (!hideCloseButton()) {
        <button type="button" class="drawer-close" (click)="close()" aria-label="Close drawer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        }
        <div class="drawer-content">
            <ng-content></ng-content>
        </div>
    </div>
</div>
}
