@if (dialogService.currentDialog(); as options) {
<app-modal [closeOnBackdropClick]="!options.isBlocking" [closeOnEscape]="!options.isBlocking" ariaLabel="Dialog"
    (closed)="onClosed()">
    <div class="dialog" [class.has-close-button]="!options.isBlocking">
        @if (!options.isBlocking) {
        <button type="button" class="dialog-close" (click)="onClosed()" aria-label="Close dialog">
            &times;
        </button>
        }

        <div class="dialog-header">
            @if (options.title) {
            <h3>{{ options.title }}</h3>
            }
        </div>

        <div class="dialog-divider"></div>

        <div class="dialog-body">
            <p>{{ options.message }}</p>
        </div>

        <div class="dialog-footer">
            @if (options.cancelLabel) {
            <button type="button" class="dialog-btn dialog-btn-cancel" (click)="onClosed()">
                {{ options.cancelLabel }}
            </button>
            }
            @if (options.confirmLabel) {
            <button type="button" class="dialog-btn dialog-btn-confirm" (click)="onConfirm()">
                {{ options.confirmLabel }}
            </button>
            }
        </div>
    </div>
</app-modal>
}
