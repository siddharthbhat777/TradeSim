<div class="number-stepper" [class]="'number-stepper--' + size()">
    <button type="button" class="number-stepper__btn" [class]="'number-stepper__btn--' + variant()"
        [disabled]="value() <= min()" (click)="decrement()" aria-label="Decrease value">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M4 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 4 8z" />
        </svg>
    </button>

    <input type="number" class="number-stepper__input" [value]="value()" [min]="min()" [max]="max()"
        (change)="onInputChange($event)" aria-label="Number input">

    <button type="button" class="number-stepper__btn" [class]="'number-stepper__btn--' + rightVariant()"
        [disabled]="value() >= max()" (click)="increment()" aria-label="Increase value">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path
                d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z" />
        </svg>
    </button>
</div>
