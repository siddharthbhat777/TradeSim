services:
  postgres:
    image: postgres:17
    container_name: tradesim-postgres
    env_file:
      - ../ENVs/database.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./tradesim-backend
    container_name: tradesim-backend
    env_file:
      - ../ENVs/backend-prod.env
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: